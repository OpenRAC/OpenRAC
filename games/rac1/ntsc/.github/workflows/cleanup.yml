name: cleanup

# docs/contributing/code-cleanup.md on the code a pull request
# changes: only problems it adds fail, older ones on main do not.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install clang-format
        run: python3 -m pip install clang-format==18.1.3
      - name: Cleanup rules on the changed code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          python3 scripts/check-cleanup.py --base "$(git merge-base "$BASE_SHA" HEAD)" \
            --title "$PR_TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
