name: checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Public, cheap checks: no game data, no compiler, no baseline build.
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Script dependencies
        run: python3 -m pip install capstone==5.0.7 pyelftools==0.33
      - name: Script regression tests
        run: python3 scripts/test_public_tools.py -v
      - name: Byte-compile the public scripts
        run: python3 -m py_compile scripts/*.py
