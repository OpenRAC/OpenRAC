name: CI

# Checks that need no disc and no toolchain. The match itself is checked locally: bash tools/check_all.sh

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: C parses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y --no-install-recommends clang
      - run: clang --version | head -1
      - run: python tools/check_syntax.py

  tests:
    name: Tool tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyelftools
      - run: python -m unittest discover -s tools/tests -p 'test_*.py'

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No retail data
        run: python tools/check_no_retail.py
      - name: Names table and header agree
        run: python tools/names.py check
      - name: Overlay file names
        run: python tools/overlay_rename.py --check
      - name: Source paths
        run: python tools/move_src.py --check
      - name: FAKEMATCH tags and table agree
        run: python tools/fakematch_scan.py --check
      - name: Data files
        run: python tools/data_in_c.py check
      - name: Doc links
        run: python tools/check_docs.py
      - name: Formatted
        run: |
          pip install -q clang-format==22.1.8
          python tools/format.py --check
      - name: Counts did not go up
        run: python tools/ratchets.py --check
