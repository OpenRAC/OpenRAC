# The decomps under games/ are git submodules with OpenRAC's patches beside them
# (docs/SOURCES.md). This checks out each at its pin, with LF line endings on every system (the
# patches are LF), and applies the patches: what `python3 tools/sources.py init` does.
name: Decomps
description: Check out each game's decomp at its pin and apply OpenRAC's patches
runs:
  using: composite
  steps:
    - name: Check out the decomps and apply their patches
      shell: bash
      run: |
        # Jobs in a container run as another user than the one owning the checkout.
        git config --global --add safe.directory '*'
        git -c core.autocrlf=false submodule update --init --depth 1 --jobs 4
        "$(command -v python3 || command -v python)" tools/sources.py apply
