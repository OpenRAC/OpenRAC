# Restores the job's compiler cache. Saving is a separate step at the end of the job
# (compiler-cache/save): only a push run that compiled something new writes a snapshot. Pull
# requests and the merge queue only read: their caches would be private to their ref and push
# develop's shared ones out of the repository's 10 GB. ccache-action does setup and statistics,
# with its own archive handling off.
name: Compiler cache
description: Restore compiler objects (compiler-cache/save writes them)
inputs:
  key:
    description: Unique job and platform namespace, without the ccache prefix
    required: true
  max-size:
    description: Maximum local compiler cache size
    default: 1G
runs:
  using: composite
  steps:
    # Every event restores; only .github/actions/compiler-cache/save writes, at the end of a job.
    - name: Restore the compiler cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.CCACHE_DIR || format(runner.os == 'Windows' && '{0}\.ccache' || '{0}/.ccache', github.workspace) }}
        key: ccache-${{ inputs.key }}-success-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ccache-${{ inputs.key }}-success-
          ccache-${{ inputs.key }}-
    # What the save step needs: where, under which key, and a mark older than any new object.
    - name: Remember the cache for the save step
      shell: bash
      env:
        DIR: ${{ env.CCACHE_DIR || format(runner.os == 'Windows' && '{0}\.ccache' || '{0}/.ccache', github.workspace) }}
        KEY: ccache-${{ inputs.key }}-success-${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        python=$(command -v python3 || command -v python) || exit 0
        "$python" -c 'import pathlib, sys; pathlib.Path(sys.argv[1]).touch()' "$RUNNER_TEMP/openrac-ccache-mark"
        {
          echo "OPENRAC_CCACHE_SAVE_DIR=$DIR"
          echo "OPENRAC_CCACHE_SAVE_KEY=$KEY"
        } >> "$GITHUB_ENV"
    - name: Install ccache
      shell: bash
      run: |
        if command -v ccache >/dev/null; then ccache --version | head -n 1; exit 0; fi
        python=python3; [ "$RUNNER_OS" = Windows ] && python=python
        "$python" "$GITHUB_ACTION_PATH/install_ccache.py" "$RUNNER_TEMP/ccache-bin" ||
          echo "::warning title=ccache::No ccache; this job may not build."
    # Configure after restoring so old cache settings cannot override this job's limits.
    # It only sets ccache up now (install: no), so its failure must not fail the job either.
    - uses: hendrikmuhs/ccache-action@e91f31892a1d1b8c44424b1a94c0b7f52d337168 # v1.2.26
      continue-on-error: true
      with:
        install: "no"
        key: ${{ inputs.key }}
        max-size: ${{ inputs.max-size }}
        restore: "false"
        save: "false"
