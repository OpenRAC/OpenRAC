# The end of a job that used ./.github/actions/compiler-cache. Writes a snapshot only on a push,
# schedule or manual run, and only when ccache stored a new object: a run that hit the cache for
# everything would add a copy of the same objects and push other caches out of the 10 GB.
name: Save the compiler cache
description: Save the compiler cache when this run added objects to it
runs:
  using: composite
  steps:
    - id: new
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
      run: |
        if [ "$EVENT" = pull_request ] || [ "$EVENT" = merge_group ] || [ -z "$OPENRAC_CCACHE_SAVE_DIR" ]; then
          echo "save=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        dir=$OPENRAC_CCACHE_SAVE_DIR mark=$RUNNER_TEMP/openrac-ccache-mark
        if command -v cygpath >/dev/null; then dir=$(cygpath -u "$dir"); mark=$(cygpath -u "$mark"); fi
        # ccache 4 names a compile result *R; stats and manifest files change on a hit too.
        added=$(find "$dir" -type f -name '*R' -newer "$mark" 2>/dev/null | wc -l)
        echo "ccache: $added new objects"
        if [ "$added" -gt 0 ]; then echo "save=true"; else echo "save=false"; fi >> "$GITHUB_OUTPUT"
    - if: steps.new.outputs.save == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.OPENRAC_CCACHE_SAVE_DIR }}
        key: ${{ env.OPENRAC_CCACHE_SAVE_KEY }}
