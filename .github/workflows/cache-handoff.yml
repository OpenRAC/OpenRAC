# develop's caches, which every pull request and queue run reads. Only a run on develop can write
# them, and develop's merge queue already built the commit a merge pushes: its jobs left each new
# cache as an artifact (.github/actions/cache-out). This saves those artifacts as develop's caches,
# under the same keys and paths, with no build. A queue run with no artifacts saves nothing.
name: cache_handoff
run-name: >-
  ${{ format('cache_handoff #{0} · push develop', github.run_number) }}

on:
  push:
    branches: [develop]

permissions:
  contents: read
  actions: read

concurrency:
  group: cache-handoff
  cancel-in-progress: false

jobs:
  cache_handoff:
    name: cache_handoff
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      # The queue run that built this commit (develop takes the queue's commit as it is).
      - name: The queue run of this commit
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run=$(gh run list --workflow checks.yml --event merge_group --commit "$GITHUB_SHA" --limit 1 \
                --json databaseId -q '.[0].databaseId // ""')
          echo "queue run: ${run:-none}"
          echo "id=$run" >> "$GITHUB_OUTPUT"
      - if: steps.run.outputs.id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: cache-*
          path: ${{ runner.temp }}/handoff
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      # Each cache back where its job had it, then saved from there.
      - name: Unpack the caches
        id: unpack
        if: steps.run.outputs.id != ''
        run: python3 .github/actions/cache-out/handoff.py unpack "$RUNNER_TEMP/handoff" 12
      - if: steps.unpack.outputs.key_1 != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          key: ${{ steps.unpack.outputs.key_1 }}
          path: ${{ steps.unpack.outputs.path_1 }}
      - if: steps.unpack.outputs.key_2 != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          key: ${{ steps.unpack.outputs.key_2 }}
          path: ${{ steps.unpack.outputs.path_2 }}
      - if: steps.unpack.outputs.key_3 != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          key: ${{ steps.unpack.outputs.key_3 }}
          path: ${{ steps.unpack.outputs.path_3 }}
      - if: steps.unpack.outputs.key_4 != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          key: ${{ steps.unpack.outputs.key_4 }}
          path: ${{ steps.unpack.outputs.path_4 }}
      - if: steps.unpack.outputs.key_5 != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          key: ${{ steps.unpack.outputs.key_5 }}
          path: ${{ steps.unpack.outputs.path_5 }}
      - if: steps.unpack.outputs.key_6 != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          key: ${{ steps.unpack.outputs.key_6 }}
          path: ${{ steps.unpack.outputs.path_6 }}
      - if: steps.unpack.outputs.key_7 != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          key: ${{ steps.unpack.outputs.key_7 }}
          path: ${{ steps.unpack.outputs.path_7 }}
      - if: steps.unpack.outputs.key_8 != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          key: ${{ steps.unpack.outputs.key_8 }}
          path: ${{ steps.unpack.outputs.path_8 }}
      - if: steps.unpack.outputs.key_9 != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          key: ${{ steps.unpack.outputs.key_9 }}
          path: ${{ steps.unpack.outputs.path_9 }}
      - if: steps.unpack.outputs.key_10 != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          key: ${{ steps.unpack.outputs.key_10 }}
          path: ${{ steps.unpack.outputs.path_10 }}
      - if: steps.unpack.outputs.key_11 != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          key: ${{ steps.unpack.outputs.key_11 }}
          path: ${{ steps.unpack.outputs.path_11 }}
      - if: steps.unpack.outputs.key_12 != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          key: ${{ steps.unpack.outputs.key_12 }}
          path: ${{ steps.unpack.outputs.path_12 }}
