# A dev release, started by hand (Actions, dev_release, Run workflow). It puts develop's current
# commit on the branch release/dev and opens (or updates) a pull request from it to master, with
# what develop adds since master. The pull request itself runs only the lint jobs. Add it to the
# merge queue ("Merge when ready"): master's queue runs everything, checks.yml (hostgen, every game
# in every version, Windows) and launcher.yml (every system's installers), and publishes the
# installers on the Development channel once all of it is green. Only then does it merge (a merge
# commit). A game that fails there is fixed on develop and this is run again.
#
# release/dev is develop's tree with master as a second parent (git merge -s ours): master only
# ever takes develop's work, so the pull request never conflicts (a release's version bump on
# master, say) and the merge is exactly what was built.
#
# The branch is a snapshot: later merges to develop reach master only with the next run. GitHub
# starts no pull_request checks for a pull request opened with the workflow's own token, so this
# job starts checks and launcher on release/dev by hand (workflow_dispatch): the lint runs and
# every other check master requires reports skipped on the pull request's commit, so it can join
# the queue. No extra token needed.
name: dev_release
# A unique title for each run: the run number and who started it.
run-name: >-
  ${{ format('dev_release #{0} · by {1}', github.run_number, github.actor) }}

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: dev-release
  cancel-in-progress: false

jobs:
  open_release_pr:
    name: open_release_pr
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
      - name: What develop adds since master
        id: notes
        run: |
          git fetch -q origin master
          count=$(git rev-list --count --first-parent origin/master..HEAD)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" = 0 ]; then
            echo "::notice::develop has nothing master lacks: no dev release."
            exit 0
          fi
          python3 - "$count" > "$RUNNER_TEMP/body.md" <<'PY'
          import re, subprocess, sys
          subjects = subprocess.check_output(
              ["git", "log", "--first-parent", "--format=%s", "origin/master..HEAD"], text=True).splitlines()
          groups = {"New": [], "Fixes": [], "Performance": [], "Other": []}
          kinds = {"feat": "New", "fix": "Fixes", "perf": "Performance"}
          for subject in subjects:
              kind = re.match(r"(\w+)(\([^)]*\))?!?:", subject)
              groups[kinds.get(kind.group(1) if kind else "", "Other")].append(subject)
          print(f"Develop at {subprocess.check_output(['git', 'rev-parse', '--short', 'HEAD'], text=True).strip()}: "
                f"{sys.argv[1]} changes since master.\n")
          for title, items in groups.items():
              if items:
                  print(f"## {title}\n")
                  print("\n".join(f"- {item}" for item in items) + "\n")
          print("## Merging\n")
          print("Add this to the merge queue (**Merge when ready**). The queue builds everything, "
                "publishes the launcher on the Development channel and then merges.")
          PY
          cat "$RUNNER_TEMP/body.md"
      - name: The SDK's version is right
        # Master's sdk workflow publishes the SDK this release has (sdk.yml): a minor that a pull
        # request merged with after the last SDK release would stop it there, after the launcher.
        if: steps.notes.outputs.count != '0'
        run: python3 sdk/tools/bump_api.py --check
      - name: The branch and its pull request
        if: steps.notes.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            merge -q -s ours --no-edit -m "chore(release): develop for master" origin/master
          git push --force origin HEAD:refs/heads/release/dev
          title="chore(release): dev build $(date -u +%Y-%m-%d)"
          number=$(gh pr list --base master --head release/dev --state open --json number -q '.[0].number // ""')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base master --head release/dev --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
          # The lint, and the checks master requires (skipped here: its queue runs them).
          gh workflow run checks.yml --ref release/dev
          gh workflow run launcher.yml --ref release/dev
