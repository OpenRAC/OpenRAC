# The mod SDK as one archive (sdk/tools/package_sdk.py): what a modder downloads to write a native
# mod without a copy of OpenRAC (docs/port/MODS.md, sdk/README.md). Each run makes the archive,
# checks its tools and that the docs' API reference is current (gen_reference.py), builds the
# template (C++) and the example (C) and runs the C++ layer's test on Windows (MSVC), Linux (GCC)
# and macOS (Clang), and builds the two for Android (the NDK), from the archive alone, unpacked
# away from the checkout; the archive is the run's artifact.
#
# Releases need no hand-made tag. A push to master (a release merged from develop) publishes the
# archive on the release sdk-v<version> when the SDK changed since the last one: bump_api.py
# --release-version gives 1.<minor>.0 for a new interface minor, else the next patch. The tag is
# made by that release, on the pushed commit, so the SDK comes out with the launcher build that
# has its interface. Run workflow with "release" does the same for another branch. A tag
# sdk-v<version> pushed by hand still publishes that version. A release is never the repository's
# Latest. Mods pin the archive's SHA-256 (OpenRAC/openrac-mods); the archive is the same bytes
# wherever it is made, so the pin holds.
#
# Every action is pinned to a commit, as in launcher.yml.
name: sdk
# Each run's title: a pull request's own title; otherwise the run number, what started it and where.
run-name: >-
  ${{ github.event_name == 'pull_request'
      && github.event.pull_request.title
  || github.ref_type == 'tag'
      && format('sdk #{0} · tag {1}', github.run_number, github.ref_name)
  || github.event_name == 'push'
      && format('sdk #{0} · push {1}', github.run_number, github.ref_name)
  || format('sdk #{0} · manual {1} · by {2}', github.run_number, github.ref_name, github.actor) }}

on:
  push:
    branches: [master]
    tags: ["sdk-v*"]
    paths: &paths
      - "sdk/**"
      - "docs/port/MODS.md"
      - ".github/workflows/sdk.yml"
      # The reference's by-area page reads which games give each call.
      - "port/game/common/mods.cpp"
      - "port/game/common/mod_play.cpp"
      - "port/game/common/mod_api/**"
      - "port/game/*/host/play.c"
  pull_request:
    paths: *paths
  workflow_dispatch:
    inputs:
      release:
        description: Publish the SDK of this branch if it changed since the last release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.ref }}
  # A run on master may publish: the next one waits for it, so a release is never cut in half.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  sdk_archive:
    name: sdk_archive
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      version: ${{ steps.release.outputs.version }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/decomp-sources
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test the SDK's tools
        # clang-format (pinned, as in checks.yml) checks that new_api.py writes the port's files
        # as port/.clang-format lays them out.
        run: |
          python3 -m pip install clang-format==21.1.8
          python3 -m unittest discover -s sdk/tools
      - name: The API reference is what the sources give
        # sdk/docs/reference is generated from the headers, the bindings and the type files.
        run: python3 sdk/tools/gen_reference.py --check
      - name: The SDK's version is the one the last release gives (bump_api.py)
        # Reads the sdk-v* tags of OpenRAC/OpenRAC and the last one's locks.
        run: python3 sdk/tools/bump_api.py --check
      - name: The ABI only grows (sdk/api locks)
        run: python3 sdk/tools/gen_api_lock.py --check
      - name: The ABI only grows, against the pull request's base
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          python3 sdk/tools/gen_api_lock.py --check --against FETCH_HEAD
      - name: The version, and whether this run publishes it
        id: release
        env:
          PUBLISH: >-
            ${{ github.repository == 'OpenRAC/OpenRAC'
                && ((github.event_name == 'push' && github.ref == 'refs/heads/master')
                    || (github.event_name == 'workflow_dispatch' && inputs.release)) }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/sdk-v* ]]; then
            version="${GITHUB_REF_NAME#sdk-v}"
            release=true
          else
            # Empty when nothing in the archive changed since the last release.
            version=$(python3 sdk/tools/bump_api.py --release-version)
            release=$([ "$PUBLISH" = true ] && [ -n "$version" ] && echo true || echo false)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [ "$release" = true ]; then
            echo "::notice::This run publishes the SDK $version (sdk-v$version)."
          elif [ "$PUBLISH" = true ]; then
            echo "::notice::The SDK did not change since its last release: nothing to publish."
          fi
      - name: Make the archive
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: python3 sdk/tools/package_sdk.py -o dist ${VERSION:+--version "$VERSION"}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openrac-mod-sdk
          path: dist/*

  # The template and the example, built from the archive alone.
  sdk_build:
    name: sdk_build_${{ matrix.name }}
    needs: sdk_archive
    strategy:
      fail-fast: false
      matrix:
        # A pull request builds on Linux only (its runners are shared with every other check);
        # master and an SDK tag build every system before anything is released. android_arm64 is
        # cross-built with the runner's NDK (Android's mods), no test run.
        name: ${{ fromJSON(github.event_name == 'pull_request' && '["linux_x86_64"]' || '["linux_x86_64", "macos_arm64", "windows_x86_64", "android_arm64"]') }}
    runs-on: ${{ matrix.name == 'macos_arm64' && 'macos-15' || matrix.name == 'windows_x86_64' && 'windows-2025' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Ninja
        run: python -m pip install ninja
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openrac-mod-sdk
          path: dist
      - name: Unpack the SDK away from any checkout
        run: |
          mkdir -p "$RUNNER_TEMP/sdk"
          cd "$RUNNER_TEMP/sdk"
          unzip -q "$GITHUB_WORKSPACE"/dist/openrac-mod-sdk-*.zip
          echo "SDK=$(ls -d "$RUNNER_TEMP"/sdk/openrac-mod-sdk-*)" >> "$GITHUB_ENV"
      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -Append $env:GITHUB_ENV }
          }
      - name: Build the template and the example
        run: |
          mkdir -p "$RUNNER_TEMP/build"
          for mod in template examples/frame-counter examples/vendor-prompt; do
            src="$RUNNER_TEMP/build/$(basename "$mod")"
            cp -r "$SDK/$mod" "$src"
            cmake -S "$src" -B "$src/build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DOpenRACMod_DIR="$SDK/cmake" \
              ${{ matrix.name == 'android_arm64' && '-DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28' || '' }}
            cmake --build "$src/build"
            python "$SDK/tools/package_mod.py" -o "$RUNNER_TEMP/dist" "$src"/build/package/*
          done
          ls "$RUNNER_TEMP/dist"
      - name: Test the C++ layer
        if: matrix.name != 'android_arm64'
        run: |
          cmake -S "$SDK/tests" -B "$RUNNER_TEMP/build/sdk-tests" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/build/sdk-tests"
          ctest --test-dir "$RUNNER_TEMP/build/sdk-tests" --output-on-failure
      - name: Package the script template
        run: |
          # A script mod has no build: checked and packaged from its own folder.
          python "$SDK/tools/package_mod.py" --check "$SDK/template-script"
          python "$SDK/tools/package_mod.py" -o "$RUNNER_TEMP/dist" "$SDK/template-script"
          ls "$RUNNER_TEMP/dist"

  sdk_release:
    name: sdk_release
    if: needs.sdk_archive.outputs.release == 'true'
    needs: [sdk_archive, sdk_build]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openrac-mod-sdk
          path: dist
      - name: Publish the archive on its release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.sdk_archive.outputs.version }}
        run: |
          tag="sdk-v$VERSION"
          test -f "dist/openrac-mod-sdk-$VERSION.zip" || { echo "::error::no dist/openrac-mod-sdk-$VERSION.zip"; exit 1; }
          sha=$(cut -d' ' -f1 dist/*.sha256)
          interface="${VERSION%.*}"
          if [ "${VERSION##*.}" = 0 ]; then
            needs="Mods built for it need OpenRAC with mod interface $interface: the Development channel from this release on, and stable launchers from the next one."
          else
            needs="Mods built for it load in every OpenRAC with mod interface $interface or newer."
          fi
          notes="The OpenRAC mod SDK $VERSION, for the mod interface $interface (docs/port/MODS.md). $needs SHA-256 of the archive: $sha"
          # Never the repository's latest release: installed launchers look for their updates at
          # releases/latest/download/latest.json, which only a launcher-v release carries.
          # A draft first, published once every file is on it: the tag (made on publish, on the
          # run's commit when it does not exist yet) never names a release with files missing.
          state=$(gh release view "$tag" --json isDraft -q '.isDraft' 2>/dev/null || echo none)
          if [ "$state" = false ]; then
            echo "::error::$tag is published already: a published release is never changed"
            exit 1
          elif [ "$state" = true ]; then
            # A draft left by a run that stopped, maybe for an older commit: made again for this one.
            gh release delete "$tag" --yes
          fi
          gh release create "$tag" --draft --title "Mod SDK $VERSION" --notes "$notes" --target "$GITHUB_SHA" \
            --latest=false dist/*
          gh release edit "$tag" --draft=false --latest=false
          echo "::notice::Published $tag."
