# iPhone and iPad checks on macOS (docs/port/IOS.md). No disc or Apple signing needed.
# Port / iOS: runtime tests, then the runtime built for iOS without a game.
# Launcher / iOS: the Rust adapter, bundle tests, icons, and the port/ios/*.mm bridges.
# macOS minutes are costly: the workflow starts only for the paths below, and the scope job
# picks the jobs a change can affect (tools/ci_scope.py ios).
name: ios

on:
  push:
    branches: [master, develop]
    paths: &paths
      - "port/**"
      - "!port/android/**"
      - "!port/tools/**"
      - "!port/**/*.md"
      - "games/*/game.json"
      - "launcher/ios/**"
      - "launcher/core/**"
      - "launcher/Cargo.toml"
      - "launcher/Cargo.lock"
      - "launcher/package.json"
      - "launcher/src/lib/palettes.json"
      - "launcher/src-tauri/icons/**"
      - "launcher/src-tauri/tauri.conf.json"
      - "tools/ci_scope.py"
      - ".github/actions/compiler-cache/**"
      - ".github/actions/launcher-toolchain/**"
      - ".github/actions/yarn-cache/**"
      - ".github/workflows/ios.yml"
  pull_request:
    # A draft runs neither job (scope below); ready_for_review runs them.
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

# As in checks.yml: new runs cancel old ones, except on master.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' }}

jobs:
  scope:
    name: Which iOS checks run
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      port: ${{ github.event.pull_request.draft && 'false' || steps.scope.outputs.ios_port }}
      launcher: ${{ github.event.pull_request.draft && 'false' || steps.scope.outputs.ios_launcher }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # PRs use the base branch's script (as checks.yml does). Pushes diff against the old commit.
      # No answer means both jobs run.
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            script="$RUNNER_TEMP/openrac-ci-scope.py"
            git show HEAD^1:tools/ci_scope.py > "$script" || exit 0
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
              && git fetch -q --no-tags --depth=1 origin "$BEFORE"; then
            script=tools/ci_scope.py
            export PUSH_BEFORE="$BEFORE"
          else
            exit 0
          fi
          python3 "$script" ios || true

  port:
    name: Port / iOS
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.port != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/compiler-cache
        with:
          key: ios-port
          max-size: 1G
      # Install only what is missing: brew fails on a tool the image installed another way.
      - name: CMake and Ninja
        run: |
          for tool in cmake ninja; do
            command -v "$tool" >/dev/null || brew install "$tool"
          done
          cmake --version | head -1
          ninja --version

      - name: Native memory and suspension tests
        run: |
          cmake -S port -B build/ios-host -G Ninja -DOPENRAC_PORT_GAMES=OFF -DOPENRAC_ENHANCED_RENDERING=OFF \
            -DOPENRAC_STATIC_SDL=ON -DOPENRAC_VULKAN=OFF -DOPENRAC_VULKAN_APPLE_DEFAULT=ON
          cmake --build build/ios-host --parallel 3 \
            --target runtime_test expanded_memory_test ios_memory_test mobile_lifecycle_test ios_controller_test
          ctest --test-dir build/ios-host -R '^(runtime|expanded_memory|ios_memory|mobile_lifecycle|ios_controller)$' \
            --output-on-failure --no-tests=error

      - name: Compile the iOS runtime and window without a game
        run: |
          cmake -S port -B build/ios-sdk -G Ninja -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 -DOPENRAC_PORT_GAMES=OFF \
            -DOPENRAC_ENHANCED_RENDERING=OFF -DOPENRAC_STATIC_SDL=ON -DOPENRAC_VULKAN=OFF -DOPENRAC_VULKAN_APPLE_DEFAULT=ON
          cmake --build build/ios-sdk --target openrac_runtime openrac_platform --parallel 3

  launcher:
    name: Launcher / iOS
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.launcher != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # Python headers for the CPython bridge (docs/port/IOS.md).
      PYTHON_APPLE: https://github.com/beeware/Python-Apple-support/releases/download/3.14-b14/Python-3.14-iOS-support.b14.tar.gz
      PYTHON_APPLE_SHA256: 703ff822529f46edcbcd8b88096b2544f6990f3109ad38b4b4b61bb489a7c1ee
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/launcher-toolchain
        with:
          cache-key: ios-launcher
          targets: aarch64-apple-ios
          components: clippy, rustfmt

      - name: Adapter tests and iOS static library
        working-directory: launcher
        run: |
          cargo test -p openrac-launcher-ios --locked
          cargo clippy -p openrac-launcher-ios --all-targets --locked -- -D warnings
          cargo build -p openrac-launcher-ios --target aarch64-apple-ios --release --locked

      - name: Catalogue configuration and icon generation
        run: |
          python3 -m unittest discover -s port/ios -p test_bundle.py
          swift port/ios/make_assets.swift launcher/src-tauri/icons/icon.png build/ios-icons/Assets.xcassets

      - name: Pinned Python headers for the native application checks
        run: |
          mkdir -p build/ios-python
          curl -sSfL --retry 5 --retry-delay 5 -o build/ios-python/python.tar.gz "$PYTHON_APPLE"
          echo "$PYTHON_APPLE_SHA256  build/ios-python/python.tar.gz" | shasum -a 256 -c -
          tar -xf build/ios-python/python.tar.gz -C build/ios-python

      # All bridges, so new ones are checked too.
      - name: Compile the UIKit, Files, WebKit and CPython bridges
        run: |
          shopt -s nullglob
          bridges=(port/ios/*.mm)
          [ ${#bridges[@]} -gt 0 ] || { echo "::error::no port/ios/*.mm"; exit 1; }
          headers=build/ios-python/Python.xcframework/ios-arm64/Python.framework/Headers
          [ -f "$headers/Python.h" ] || { echo "::error::$PYTHON_APPLE has no $headers/Python.h"; exit 1; }
          xcrun clang++ -fsyntax-only -std=c++20 -fobjc-arc -target arm64-apple-ios17.0 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -Iport -Ilauncher/ios/include -I"$headers" \
            '-DOPENRAC_IOS_GAME="rac1-ntsc"' "${bridges[@]}"
