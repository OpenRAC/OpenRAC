# Checks that need neither a disc nor a toolchain: OpenRAC's own tests, the
# editor's, the generated tables, and each game's toolchain-free checks as
# its original repository ran them. Game builds need your own disc and
# proprietary compilers, so they run on contributors' machines.
#
# Every action is pinned to a commit (Dependabot, .github/dependabot.yml,
# moves the pins); the port's compiles are cached with ccache.
name: checks

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      time-vulkan-shards:
        description: Compare one, two and four Vulkan equivalence shards on one runner
        type: boolean
        default: false

permissions:
  contents: read

env:
  # tools/build_port.py compiles on every thread of the runner (build_jobs), not all but two.
  OPENRAC_BUILD_JOBS: all
  # Reinstalling identical compiler bytes must not invalidate all cached objects.
  CCACHE_COMPILERCHECK: content

# New PR pushes and develop merges supersede old runs; master's release checks all finish.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' }}

jobs:
  # What a pull request needs (tools/ci_scope.py: the jobs and the port's parts its files can
  # affect), and on every event all the parts the Linux port job is built in: one for what the
  # games share, one per game program (port/game/*/hostgen.json "id"). A push runs everything.
  scope:
    name: Which checks run
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      launcher: ${{ steps.scope.outputs.launcher }}
      pages: ${{ steps.scope.outputs.pages }}
      port: ${{ steps.scope.outputs.port }}
      enhanced: ${{ steps.scope.outputs.enhanced }}
      port_programs: ${{ steps.parts.outputs.port_programs }}
      port_parts: ${{ steps.scope.outputs.port_parts || steps.parts.outputs.port_parts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: parts
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          programs = sorted(json.loads(path.read_text())["id"]
                            for path in pathlib.Path("port/game").glob("*/hostgen.json"))
          print("port_programs=" + json.dumps(programs))
          print("port_parts=" + json.dumps(["common", *programs]))
          PY
      - id: scope
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Use the base branch's policy so a PR changing the gate gets full checks.
          script="$RUNNER_TEMP/openrac-ci-scope.py"
          if git show HEAD^1:tools/ci_scope.py > "$script"; then
            python3 "$script"
          fi

  checks:
    name: Repository (tools, tables, conventions)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/decomp-sources
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Each decomp's pin matches its game.json, and a pull request that moves one also changes
      # the port's tables made from it (tools/sources.py check).
      - name: Decomp pins
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then
            git fetch -q --depth=1 origin "$BASE"
            python tools/sources.py check --since "$BASE"
          else
            python tools/sources.py check
          fi

      # The workflows themselves: actionlint at a fixed version, checked against its SHA-256.
      - name: Workflows
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sSfL --retry 5 --retry-delay 5 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck=

      - name: OpenRAC tools
        run: python -m unittest discover -s tools -v

      - name: PAL and NTSC rendering host-hook parity
        run: python -m unittest discover -s port/tools/hostgen -p test_host_hook_parity.py -v

      - name: Level editor (synthetic data only)
        run: python -m unittest discover -s editor -v

      - name: Probe bake planning (synthetic data only)
        run: python -m unittest discover -s port/enhanced/tools/baker -v

      - name: Water bake preparation (synthetic data only)
        run: python -m unittest discover -s port/enhanced/tools/water -v

      # The port's countable conventions (port/docs/CODING_CONVENTIONS.md): the rules for every
      # file, and the new-code rules on what this push or pull request adds. A line it changes that
      # clang-format would lay out differently fails the step (--strict-touched; the page, section
      # 24.4), in older files too. clang-format is pinned.
      - name: Port conventions
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python -m pip install clang-format==21.1.8
          python -m unittest discover -s port/tools/conventions -v
          base=""
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            base="$BEFORE"
          fi
          if [ -n "$base" ]; then
            git fetch --no-tags --depth=1 origin "$base"
            python port/tools/conventions/check_conventions.py --since "$base" --touched --strict-touched --clang-format clang-format
          else
            python port/tools/conventions/check_conventions.py
          fi

      # The layout of the C++ under port/ and sdk/ (port/docs/CODING_CONVENTIONS.md, section 5.6):
      # clang-format and the blank lines around control blocks. Report only: the step
      # lists what would change and never fails the build. clang-format comes from the step above.
      - name: C++ layout (report only)
        run: python tools/cpp_style.py --report-only

      # The port's includes against the module layering (port/docs/CODING_CONVENTIONS.md, section
      # 18): a new include of a higher layer fails; today's violations are the exceptions listed in
      # port/tools/layering/rules.tsv. Standard-library Python, the whole port on every run.
      - name: Port layering
        run: |
          python -m unittest discover -s port/tools/layering -v
          python port/tools/layering/layering.py

      - name: Generated tables match games/*/game.json and the reports
        run: |
          python tools/openrac.py tables
          git diff --exit-code -- README.md baserom/README.md games/README.md docs/SOURCES.md

      - name: Files the games share are still the same file
        run: python tools/shared.py check

      - name: rac1/pal progress report is current with its source
        working-directory: games/rac1/decomp
        run: python tools/gen_progress_report.py --check

      - name: rac4 progress reports are current with their source
        working-directory: games/rac4/decomp
        # rac4-decomp's reports (progress/report.json, progress/pal/), as its own CI checks them;
        # gen_progress_report.py's legacy report is a build output now (build/legacy_report.json).
        run: |
          python tools/progress.py --version us --check
          python tools/progress.py --version pal --check

      - name: rac1/ntsc tools
        working-directory: games/rac1/ntsc-decomp
        run: |
          # scripts/data-refs.py and its tests read the executable with these
          # (the versions requirements.txt pins).
          python -m pip install capstone==5.0.7 pyelftools==0.33
          python scripts/test_public_tools.py -v
          python -m py_compile scripts/*.py

      - name: rac2 tools, layout and progress report
        working-directory: games/rac2/decomp
        run: |
          # tools/check.py disassembles with it, at the version the decomp pins.
          python -m pip install "$(grep '^rabbitizer==' requirements.txt)"
          python -m unittest discover -s tests -v
          python tests/check_repository.py
          python tools/progress.py --check

      - name: rac5 tools and layout
        working-directory: games/rac5/decomp
        run: |
          python -m unittest discover -s tests -v
          python tools/check_repository.py

      - name: rac6 tools and layout
        working-directory: games/rac6/decomp
        run: |
          python -m unittest discover -s tests -v
          python tools/check_repository.py

  # The desktop launcher (launcher/): its UI checks, and its Rust side, whose tests also check
  # launcher/actions.json against games/*/game.json. On Windows too, where paths join with
  # backslashes, files are checked out with CRLF and the Unix-only tests are left out.
  launcher:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.launcher != 'false' }}
    name: Launcher / ${{ matrix.system }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { system: Linux, os: ubuntu-26.04 }
          - { system: Windows, os: windows-latest }
    defaults:
      run:
        shell: bash
        working-directory: launcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/decomp-sources
      - uses: ./.github/actions/launcher-toolchain
        with:
          cache-key: checks-launcher-${{ matrix.os }}
          components: clippy, rustfmt
      - name: Tauri's system libraries
        if: runner.os == 'Linux'
        run: |
          apt=(sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          packages=(libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev)
          "${apt[@]}" update
          # As launcher.yml: the downloads first, within five minutes (the runner's Azure mirror has
          # sent packages at 90 kB/s), then once more from Ubuntu's own archive.
          fetch() { timeout 300 "${apt[@]}" install -y --no-install-recommends --download-only "${packages[@]}"; }
          if ! fetch; then
            echo "::warning::the packages did not come within five minutes: once more without the Azure mirror"
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
              grep -q '^http' /etc/apt/apt-mirrors.txt \
                || echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
            fi
            "${apt[@]}" update
            "${apt[@]}" install -y --no-install-recommends --download-only "${packages[@]}"
          fi
          "${apt[@]}" install -y --no-install-recommends "${packages[@]}"

      # The pages' checks (yarn verify) are the same on every system: they run once, in
      # launcher-android. Here only what differs per system: the Rust side.
      - name: Rust format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Rust tests (the logic, and actions.json against the checkout)
        run: cargo test -p openrac-launcher-core

      - name: Rust lints (the whole app)
        run: |
          yarn install --immutable
          yarn build
          cargo clippy --workspace --all-targets -- -D warnings

  # The launcher's pages, once (they are the same on every system): svelte-check, ESLint,
  # Prettier and Vitest, then the Android layout in a browser (launcher/e2e/), page by page. No
  # Rust, one browser, one Vite server. On 24.04, which Playwright's install-deps knows.
  launcher-android:
    name: Launcher / Pages (lint, unit tests, Android layout)
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.pages != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: launcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/decomp-sources
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
          package-manager-cache: false
      - run: npm install --global corepack@0.36.0 && corepack enable
      - uses: ./.github/actions/yarn-cache
      - name: The launcher's packages
        run: yarn install --immutable
      - name: Lint and unit tests (svelte-check, ESLint, Prettier, Vitest)
        run: yarn verify
      - name: A headless Chromium
        run: yarn playwright-core install --with-deps chromium-headless-shell
      - name: Android pages
        run: yarn test:android

  # The native port (port/): hostgen's tests, then the port built with Clang and system SDL3, with
  # enhanced rendering compiled out, in parts, each on its own runner so that none outgrows the time
  # limit with a cold cache. "common" builds everything but the games' programs
  # (OPENRAC_PORT_GAMES_IN_ALL=OFF) and runs every test without a game-* label, exercising the
  # compatibility OpenGL/ES and core Vulkan paths on Mesa's software renderer. Each program's part
  # (port/game/*/hostgen.json "id": rac1-pal, rac2-ntsc...) builds openrac-<id> and runs its tests,
  # labelled game-<id> (port/cmake/Games.cmake). One part per program, not per game: Going
  # Commando's three programs in one job took 53 minutes with a cold cache. Every test runs in
  # exactly one part.
  port-part:
    name: Port / Linux (${{ matrix.part }})
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.port_parts != '[]' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.scope.outputs.port_parts) }}
    env:
      PART: ${{ matrix.part }}
      PORT_PROGRAMS: ${{ needs.scope.outputs.port_programs }}
      MESA_SHADER_CACHE_DIR: /tmp/openrac-mesa
      MESA_SHADER_CACHE_MAX_SIZE: 1G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/decomp-sources
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Each key's prefix is no other job's: "checks-port" was the start of every other port
      # job's key, and restored their objects, built with other options, when it had none. One key
      # per part, so that one program's objects never evict another's.
      - uses: ./.github/actions/compiler-cache
        with:
          key: checks-port-release-${{ matrix.part }}
          max-size: 1G
      - uses: ./.github/actions/mesa-cache
        if: matrix.part == 'common'
        with:
          variant: ubuntu-release
      - name: Compilers, SDL3 and software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld ninja-build libsdl3-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgl1-mesa-dri mesa-vulkan-drivers vulkan-validationlayers

      - uses: ./.github/actions/port-build-cache
        with:
          variant: ubuntu-compatibility-${{ matrix.part }}
          preset: release
          hostgen: ${{ matrix.part != 'common' }}

      - name: hostgen and build cache regressions
        if: matrix.part == 'common'
        run: |
          python -m unittest discover -s port/tools/hostgen -v
          # This job installs both Clang and ccache, so the real cache fixture runs here.
          python -m unittest discover -s tools -p test_ci_cache.py -v
          python -m unittest discover -s tools -p test_hostgen_cache.py -v

      - name: Build
        working-directory: port
        run: |
          cmake --preset release -DOPENRAC_ENHANCED_RENDERING=OFF -DOPENRAC_PROBE_BAKER=OFF \
            -DOPENRAC_PORT_GAMES_IN_ALL=OFF
          if [ "$PART" = common ]; then
            cmake --build --preset release
          else
            cmake --build --preset release --target "openrac-$PART"
          fi

      # Run once: the configuration is the same in every part.
      - name: Verify compatibility build configuration
        if: matrix.part == 'common'
        working-directory: port
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          cache = pathlib.Path('build/release/CMakeCache.txt').read_text().splitlines()
          assert 'OPENRAC_ENHANCED_RENDERING:BOOL=OFF' in cache
          assert 'OPENRAC_PROBE_BAKER:BOOL=OFF' in cache
          tests = json.loads(subprocess.check_output(
              ['ctest', '--preset', 'release', '--show-only=json-v1']))['tests']
          names = {test['name'] for test in tests}
          enhanced = {'gtao_vulkan', 'probe_gpu_vulkan', 'early_lighting_vulkan',
                      'hero_shadow_vulkan', 'sun_shadow_vulkan', 'shadow_scroll_vulkan',
                      'fsr3_frame', 'probe_bake'}
          assert not names & enhanced, names & enhanced
          # Every game label is a part's: no test is left out of every part.
          programs = set(json.loads(os.environ['PORT_PROGRAMS']))
          for test in tests:
              labels = [label for prop in test.get('properties', []) if prop['name'] == 'LABELS'
                        for label in prop['value'] if label.startswith('game-')]
              assert len(labels) <= 1, (test['name'], labels)
              assert all(label[len('game-'):] in programs for label in labels), (test['name'], labels)
          PY

      - name: Tests
        working-directory: port
        env:
          SDL_VIDEO_DRIVER: offscreen
        run: |
          if [ "$PART" = common ]; then
            ctest --preset release --parallel 2 --stop-on-failure -LE '^game-'
          else
            ctest --preset release --parallel 2 --stop-on-failure --no-tests=error -L "^game-$PART\$"
          fi

  # One check for every part (what branch protection requires).
  port:
    name: Port / Linux
    needs: [scope, port-part]
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every part
        env:
          RESULT: ${{ needs.port-part.result }}
          PARTS: ${{ needs.scope.outputs.port_parts }}
        # Skipped only when the pull request needs no part.
        run: test "$RESULT" = success || { test "$RESULT" = skipped && test "$PARTS" = "[]"; }

  # Full enhanced Vulkan coverage and the offline Embree baker, separately from
  # the compatibility build above. The preset explicitly compiles enhanced code in.
  port-vulkan-enhanced-build:
    name: Port / Enhanced Vulkan build
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.enhanced != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/decomp-sources
      - uses: ./.github/actions/compiler-cache
        with:
          key: checks-port-enhanced
          max-size: 1G
      - name: Restore enhanced Vulkan packages
        id: enhanced-apt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openrac-enhanced-apt/*.deb
          key: enhanced-apt-v1-ubuntu-26.04-${{ runner.arch }}-${{ hashFiles('.github/workflows/checks.yml') }}
          restore-keys: enhanced-apt-v1-ubuntu-26.04-${{ runner.arch }}-
      - name: Compilers, software Vulkan and Embree 4
        run: |
          archives="$RUNNER_TEMP/openrac-enhanced-apt"
          mkdir -p "$archives"
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="$archives" install -y --no-install-recommends \
            clang lld ninja-build libembree-dev libsdl3-dev \
            libgl1-mesa-dev libegl1-mesa-dev
      - name: Save enhanced Vulkan packages
        if: steps.enhanced-apt.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openrac-enhanced-apt/*.deb
          key: ${{ steps.enhanced-apt.outputs.cache-primary-key }}
      - uses: ./.github/actions/port-build-cache
        with:
          variant: ubuntu-enhanced-baker
          preset: enhanced
          hostgen: "false"

      - name: Build enhanced lighting and baker
        working-directory: port
        run: |
          # Keep the preset's compiler flags so PRs can reuse develop's cached objects.
          cmake --preset enhanced -DOPENRAC_PORT_GAMES=OFF -DOPENRAC_PROBE_BAKER=ON \
            -DOPENRAC_BAKE_LZ4=ON \
            -DOPENRAC_LIGHT_AUTHORING=ON -DOPENRAC_RENDER_EQUIVALENCE_FOUR_SHARDS=ON \
            -DOPENRAC_VULKAN_TEST_SEED_CACHE=ON
          cmake --build --preset enhanced
      - name: Package the enhanced test build
        run: |
          python3 tools/ci_port_tests.py port/build/enhanced plan
          # CTest and some fixtures embed absolute paths. Consumers use the same checkout layout.
          pwd -P > port/build/enhanced/ci-workspace.txt
          tar -C port/build --exclude=CMakeFiles --exclude='*-src' --exclude='*-subbuild' \
            --exclude='*.a' --exclude='*.o' --exclude='*.ninja' --exclude='.ninja_*' \
            --exclude=Testing --exclude=CMakeCache.txt \
            -cf - enhanced | gzip -1 > "$RUNNER_TEMP/openrac-enhanced-tests.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openrac-enhanced-tests
          path: ${{ runner.temp }}/openrac-enhanced-tests.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  port-vulkan-enhanced-tests:
    name: Port / Enhanced Vulkan tests (${{ matrix.group }})
    needs: port-vulkan-enhanced-build
    # It asks for the build alone: the build's own condition covers scope.
    if: ${{ !cancelled() && needs.port-vulkan-enhanced-build.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # cpu and baker take half a minute each: one runner for both.
        group: [vulkan, equivalence, cpu-baker]
    env:
      SDL_VIDEO_DRIVER: x11
      LIBGL_ALWAYS_SOFTWARE: "1"
      # Fedora retains default LLVM optimisation coverage.
      GALLIVM_PERF: nopt
      MESA_SHADER_CACHE_DIR: /tmp/openrac-mesa
      MESA_SHADER_CACHE_MAX_SIZE: 1G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/decomp-sources
      - uses: ./.github/actions/mesa-cache
        if: matrix.group == 'vulkan' || matrix.group == 'equivalence'
        with:
          variant: ubuntu-enhanced-nopt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openrac-enhanced-tests
          path: ${{ runner.temp }}
      - name: Install test runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libembree-dev libsdl3-dev \
            libgl1 libegl1 libgles2 libglx-mesa0 libegl-mesa0 libgl1-mesa-dri \
            mesa-vulkan-drivers vulkan-validationlayers xvfb xauth
      - name: Run the restored test group
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: |
          mkdir -p port/build
          tar -C port/build -xzf "$RUNNER_TEMP/openrac-enhanced-tests.tar.gz"
          test "$(cat port/build/enhanced/ci-workspace.txt)" = "$(pwd -P)"
          for group in ${TEST_GROUP//-/ }; do
            xvfb-run -a python3 tools/ci_port_tests.py port/build/enhanced "$group"
          done
      - name: Measure Vulkan shard contention
        if: github.event_name == 'workflow_dispatch' && inputs.time-vulkan-shards && matrix.group == 'vulkan'
        run: xvfb-run -a python3 tools/ci_port_tests.py port/build/enhanced timing

  # One check for the build and every test group (what branch protection requires).
  port-vulkan-enhanced:
    name: Port / Enhanced Vulkan
    needs: [scope, port-vulkan-enhanced-build, port-vulkan-enhanced-tests]
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require the build and all test groups
        env:
          BUILD_RESULT: ${{ needs.port-vulkan-enhanced-build.result }}
          TEST_RESULT: ${{ needs.port-vulkan-enhanced-tests.result }}
          NEEDED: ${{ needs.scope.outputs.enhanced }}
        # Skipped only when the pull request does not touch what the enhanced build reads.
        run: |
          if [ "$NEEDED" = false ]; then test "$BUILD_RESULT" = skipped; exit; fi
          test "$BUILD_RESULT" = success && test "$TEST_RESULT" = success

  # The native port on Fedora (the release players run): the program built as the launcher's
  # "Build the game" builds it (tools/build_port.py), against the system's SDL3, Clang and CMake,
  # then all non-Vulkan tests and a small Vulkan smoke set (hostgen's tests run once, in port). The full Vulkan
  # suite runs in port-vulkan-enhanced; this set retains Fedora's optimised Mesa coverage.
  port-fedora:
    name: Port / Fedora
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.port != 'false' }}
    runs-on: ubuntu-26.04
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 60
    env:
      # Every compile through ccache, kept between runs as the other port jobs keep theirs.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      MESA_SHADER_CACHE_DIR: /tmp/openrac-mesa
      MESA_SHADER_CACHE_MAX_SIZE: 1G
    steps:
      - name: Compilers and SDL3
        run: |
          dnf install -y --setopt=install_weak_deps=False git clang cmake ninja-build python3 ccache \
            SDL3-devel mesa-libGL-devel mesa-libEGL-devel mesa-dri-drivers \
            libX11-devel libXext-devel libXrandr-devel libXcursor-devel libXi-devel libXScrnSaver-devel \
            wayland-devel libxkbcommon-devel alsa-lib-devel pulseaudio-libs-devel mesa-vulkan-drivers
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/decomp-sources

      - uses: ./.github/actions/compiler-cache
        with:
          key: checks-port-fedora
          max-size: 500M
      - uses: ./.github/actions/mesa-cache
        with:
          variant: fedora-release

      - uses: ./.github/actions/port-build-cache
        with:
          variant: fedora44-release
          preset: release

      - name: Build openrac-rac1-pal as the launcher builds it
        run: python3 tools/build_port.py rac1-pal

      # Every test program (the *_test targets), not the whole port: rac1/ntsc's program calls a
      # memchr nothing declares, which Clang 16 and later refuse.
      - name: Build the tests
        working-directory: port
        run: |
          targets=$(ninja -C build/release -t targets all | sed -n 's/^\([A-Za-z0-9_]*_test\): .*/\1/p' | sort -u)
          cmake --build --preset release --target $targets

      - name: Non-Vulkan tests and Vulkan smoke coverage
        working-directory: port
        env:
          SDL_VIDEO_DRIVER: offscreen
        run: |
          # GPU labels include Vulkan tests whose names do not mention Vulkan.
          ctest --preset release --parallel 2 --stop-on-failure --no-tests=error -LE '^gpu$'
          # Keep backend, shader, scene and enhanced-lighting smoke coverage, without
          # repeating the expensive equivalence, probe, GTAO and shadow matrices.
          vulkan_smoke='^(vulkan_(buffer|failure|uniform|present|present_timing|prewarm)|renderer_(direct|shader)_vulkan|world_gl_smoke_vulkan|enhanced_rendering(_off)?_vulkan|early_lighting_vulkan|hero_shadow_vulkan)$'
          ctest --preset release --parallel 2 --stop-on-failure --no-tests=error -R "$vulkan_smoke"

  # The native port on Windows: rac1/pal's program built as the launcher's
  # "Build the game" builds it (tools/build_port.py: Visual Studio's C++
  # libraries and the Windows SDK, Clang, Ninja), then the runtime's tests and
  # those of hostgen's that need no POSIX host. The port is written on Linux
  # and macOS, and what only builds there (execinfo.h, fseeko) stops here.
  port-windows:
    name: Port / Windows
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.port != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/decomp-sources
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: ./.github/actions/compiler-cache
        with:
          key: checks-port-windows
          max-size: 1G
      - uses: ./.github/actions/clang-windows

      - uses: ./.github/actions/port-build-cache
        with:
          variant: windows-release
          preset: release

      - name: Build openrac-rac1-pal and the runtime and diagnostic tests
        run: python tools/build_port.py rac1-pal --target runtime_test --target log_test --target crash_symbols_test --target breadcrumbs_test --target breadcrumbs_no_alloc_test --target render_worker_test

      - name: The runtime and Windows diagnostic tests
        run: ctest --test-dir port/build/release -R "^(runtime|log|crash_symbols|crash_symbols_local|breadcrumbs|breadcrumbs_no_alloc|render_worker)$" --output-on-failure

      - name: hostgen's tests
        run: python -m unittest discover -s port/tools/hostgen -v
