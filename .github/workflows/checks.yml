# Checks that need neither a disc nor a toolchain: OpenRAC's own tests, the
# extractor's, the generated tables, and each game's toolchain-free checks as
# its original repository ran them. Game builds need your own disc and
# proprietary compilers, so they run on contributors' machines.
#
# Every action is pinned to a commit (Dependabot, .github/dependabot.yml,
# moves the pins); the port's compiles are cached with ccache.
name: checks

# The games (hostgen and each version's build) and Windows build only for a dev release (its pull
# request from develop to master, .github/workflows/dev-release.yml) and a manual run (Run
# workflow). The push to master that merges it runs only the repository checks: what it brings was
# built on the pull request. A game that breaks there is fixed on develop. Pull requests to
# develop, the merge queue and develop pushes build the port's shared part and run its tests
# (tools/ci_scope.py). A pull request runs the fast tier; the queue and develop pushes
# the full tier, which adds the enhanced Vulkan build and tests. develop's runs are the only ones
# that write the caches (.github/actions/*/save), so they are never cancelled.
on:
  push:
    branches: [master, develop]
  pull_request:
    # ready_for_review: a draft skips the port's builds (scope below), so they run when it is ready.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  # tools/build_port.py compiles on every thread of the runner (build_jobs), not all but two.
  OPENRAC_BUILD_JOBS: all
  # Reinstalling identical compiler bytes must not invalidate all cached objects.
  CCACHE_COMPILERCHECK: content
  # The runners have no disc: games whose code is translated from it (rac3-pal's "retail"
  # "required") build with stubs on purpose instead of stopping (port/tools/hostgen/asmc.py).
  OPENRAC_HOSTGEN_NO_DISC: "1"

# A new push to a pull request supersedes its old run. Pushes finish: develop's write the caches
# every pull request reads, and master's are a release's checks. Each merge queue group has a ref
# of its own.
concurrency:
  group: checks-${{ github.ref }}
  # A new dev release replaces release/dev: its older run goes too.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/release/dev' }}

jobs:
  # What a run needs (tools/ci_scope.py: the jobs and the port's parts its files can affect, in
  # the event's tier), and on every event all the parts the Linux port job is built in: one for
  # what the games share, one per game program (port/game/*/hostgen.json "id"). A dev release's
  # pull request to master and a manual run run everything; a push to master only the repository
  # checks. A draft pull request runs no port build, only the cheap checks; marking it ready
  # runs the rest.
  scope:
    name: Plan
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      launcher: ${{ steps.scope.outputs.launcher }}
      pages: ${{ steps.scope.outputs.pages }}
      port: ${{ github.event.pull_request.draft && 'false' || steps.scope.outputs.port }}
      enhanced: ${{ github.event.pull_request.draft && 'false' || steps.scope.outputs.enhanced }}
      windows: ${{ github.event.pull_request.draft && 'false' || steps.scope.outputs.windows || 'true' }}
      launcher_systems: ${{ steps.scope.outputs.launcher_systems || '["Linux", "Windows"]' }}
      port_programs: ${{ steps.parts.outputs.port_programs }}
      port_parts: ${{ github.event.pull_request.draft && '[]' || steps.scope.outputs.port_parts || steps.parts.outputs.port_parts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: parts
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          programs = sorted(json.loads(path.read_text())["id"]
                            for path in pathlib.Path("port/game").glob("*/hostgen.json"))
          print("port_programs=" + json.dumps(programs))
          print("port_parts=" + json.dumps(["common", *programs]))
          PY
      - id: scope
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          # The base branch's policy, so that a change to the gate gets full checks. A develop
          # push checks what it changed (it landed through the queue, which checked all of it);
          # a pull request to master (a dev release), any other push or a manual run gives every
          # output (the defaults).
          script="$RUNNER_TEMP/openrac-ci-scope.py"
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              [ "$GITHUB_BASE_REF" != master ] || exit 0
              git show HEAD^1:tools/ci_scope.py > "$script" || exit 0 ;;
            merge_group)
              git fetch -q --no-tags --depth=1 origin "$MERGE_BASE" || exit 0
              git show "$MERGE_BASE:tools/ci_scope.py" > "$script" || exit 0 ;;
            push)
              if [ "$GITHUB_REF" = refs/heads/master ]; then
                echo "docs_only=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              [ "$GITHUB_REF" = refs/heads/develop ] && [ -n "$BEFORE" ] || exit 0
              [ "$BEFORE" != 0000000000000000000000000000000000000000 ] || exit 0
              git fetch -q --no-tags --depth=1 origin "$BEFORE" || exit 0
              script=tools/ci_scope.py
              export PUSH_BEFORE="$BEFORE" ;;
            *) exit 0 ;;
          esac
          python3 "$script"

  # Starts at once, beside scope: most failures are found here, in a few minutes.
  checks:
    name: "Repository: tools, tables, conventions"
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/decomp-sources
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # A pull request runs a decomp's own tool checks only when it changes that game (tools/ci_scope.py
      # decomp-games); the merge queue and pushes run them all. With the base branch's script, as in scope.
      - name: Which games' decomp tools to check
        id: games
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          script="$RUNNER_TEMP/openrac-ci-scope.py"
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git show HEAD^1:tools/ci_scope.py > "$script" \
              && grep -q decomp-games "$script"; then
            python3 "$script" decomp-games || echo 'games=["rac1", "rac2", "rac4", "rac5", "rac6"]' >> "$GITHUB_OUTPUT"
          else
            echo 'games=["rac1", "rac2", "rac4", "rac5", "rac6"]' >> "$GITHUB_OUTPUT"
          fi

      # Each decomp's pin matches its game.json, and a pull request that moves one also changes
      # the port's tables made from it and has its build facts published (tools/sources.py check).
      - name: Decomp pins
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$BASE" ]; then
            git fetch -q --depth=1 origin "$BASE"
            python tools/sources.py check --since "$BASE"
          else
            python tools/sources.py check
          fi

      # The workflows themselves: actionlint at a fixed version, checked against its SHA-256.
      - name: Workflows
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sSfL --retry 5 --retry-delay 5 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck=

      - name: OpenRAC tools
        run: python -m unittest discover -s tools -v

      - name: PAL and NTSC rendering host-hook parity
        run: python -m unittest discover -s port/tools/hostgen -p test_host_hook_parity.py -v

      # Every game version's tables, with no disc (port/tools/versionmap/check_versions.py): each
      # version binds each function alike or its game's parity.tsv says why, carried releases'
      # tables are what their tool writes, each version's names table covers the shared host C, and
      # the built-in keyboard and mouse has each version's addresses.
      # A new game or version is found by its files, so this step does not change.
      - name: Game versions' tables
        run: |
          python -m unittest discover -s port/tools/versionmap -p test_parity.py -v
          python -m unittest discover -s port/tools/versionmap -p test_kbm_discs.py -v
          python -m unittest discover -s port/tools/hostgen -p test_release_carry_rac3.py -v
          python port/tools/versionmap/check_versions.py

      # The extractor (what OpenRAC Editor's tools import: extractor_api.json), synthetic data only.
      - name: Extractor (synthetic data only)
        run: python -m unittest discover -s extractor -v

      # Again on the oldest Python the launcher accepts (config.rs), which players may have.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python310
        with:
          python-version: "3.10"
          update-environment: false
      - name: Extractor on Python 3.10
        env:
          PYTHON310: ${{ steps.python310.outputs.python-path }}
        run: '"$PYTHON310" -m unittest discover -s extractor'

      - name: Probe bake planning (synthetic data only)
        run: python -m unittest discover -s port/enhanced/tools/baker -v

      - name: Water bake preparation (synthetic data only)
        run: python -m unittest discover -s port/enhanced/tools/water -v

      # The port's countable conventions (docs/CODING_CONVENTIONS.md): the rules for every
      # file, and the new-code rules on what this push or pull request adds. A line it changes that
      # clang-format would lay out differently fails the step (--strict-touched; the page, section
      # 24.4), in older files too. clang-format is pinned. Code reaches master only through a dev
      # release, whose lines develop's pull requests already checked: a pull request or push to
      # master runs only the every-file rules.
      - name: Port conventions
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          TO_MASTER: ${{ github.base_ref == 'master' || github.ref == 'refs/heads/master' }}
        run: |
          python -m pip install clang-format==21.1.8
          python -m unittest discover -s port/tools/conventions -v
          base=""
          if [ "$TO_MASTER" = true ]; then
            base=""
          elif [ "$EVENT" = pull_request ] || [ "$EVENT" = merge_group ]; then
            base="$PR_BASE"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            base="$BEFORE"
          fi
          if [ -n "$base" ]; then
            git fetch --no-tags --depth=1 origin "$base"
            python port/tools/conventions/check_conventions.py --since "$base" --touched --strict-touched --clang-format clang-format
          else
            python port/tools/conventions/check_conventions.py
          fi

      # The layout of the C++ under port/ and sdk/ (docs/CODING_CONVENTIONS.md, section 5.6):
      # clang-format and the blank lines around control blocks. Report only: the step
      # lists what would change and never fails the build. clang-format comes from the step above.
      # Pushes only: a report nobody waits for.
      - name: C++ layout (report only)
        if: github.event_name == 'push'
        run: python tools/cpp_style.py --report-only

      # Repeated code in the port's C and C++ (docs/CODING_CONVENTIONS.md, section 22.6): runs of
      # 60 tokens found twice that tools/dup_check_baseline.tsv does not accept. Report only for now.
      - name: Repeated code (report only)
        if: github.event_name == 'push'
        run: python tools/dup_check.py --report-only

      # The port's includes against the module layering (docs/CODING_CONVENTIONS.md, section
      # 18): a new include of a higher layer fails; today's violations are the exceptions listed in
      # port/tools/layering/rules.tsv. Standard-library Python, the whole port on every run.
      - name: Port layering
        run: |
          python -m unittest discover -s port/tools/layering -v
          python port/tools/layering/layering.py

      - name: Generated tables match games/*/game.json and the reports
        run: |
          python tools/openrac.py tables
          git diff --exit-code -- README.md baserom/README.md games/README.md docs/SOURCES.md

      - name: Files the games share are still the same file
        run: python tools/shared.py check

      - name: rac1/pal progress report is current with its source
        if: contains(fromJSON(steps.games.outputs.games), 'rac1')
        working-directory: games/rac1/decomp
        run: python tools/gen_progress_report.py --check

      - name: rac4 progress reports are current with their source
        if: contains(fromJSON(steps.games.outputs.games), 'rac4')
        working-directory: games/rac4/decomp
        # rac4-decomp's reports (progress/report.json, progress/pal/), as its own CI checks them;
        # gen_progress_report.py's report is a build output (build/legacy_report.json).
        run: |
          python tools/progress.py --version us --check
          python tools/progress.py --version pal --check

      - name: rac1/ntsc tools
        if: contains(fromJSON(steps.games.outputs.games), 'rac1')
        working-directory: games/rac1/ntsc-decomp
        run: |
          # scripts/data-refs.py and its tests read the executable with these
          # (the versions requirements.txt pins).
          python -m pip install capstone==5.0.7 pyelftools==0.33
          python scripts/test_public_tools.py -v
          python -m py_compile scripts/*.py

      - name: rac2 tools, layout and progress report
        if: contains(fromJSON(steps.games.outputs.games), 'rac2')
        working-directory: games/rac2/decomp
        run: |
          # tools/check.py disassembles with it, at the version the decomp pins.
          python -m pip install "$(grep '^rabbitizer==' requirements.txt)"
          python -m unittest discover -s tests -v
          python tests/check_repository.py
          python tools/progress.py --check

      - name: rac5 tools and layout
        if: contains(fromJSON(steps.games.outputs.games), 'rac5')
        working-directory: games/rac5/decomp
        run: |
          python -m unittest discover -s tests -v
          python tools/check_repository.py

      - name: rac6 tools and layout
        if: contains(fromJSON(steps.games.outputs.games), 'rac6')
        working-directory: games/rac6/decomp
        run: |
          python -m unittest discover -s tests -v
          python tools/check_repository.py

  # The desktop launcher (launcher/): its Rust side, whose tests also check launcher/actions.json
  # against games/*/game.json. Linux in every tier; Windows, where paths join with backslashes,
  # files are checked out with CRLF and the Unix-only tests are left out, for a dev release.
  launcher:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.launcher != 'false' && needs.scope.outputs.launcher_systems != '[]' }}
    name: "${{ matrix.system == 'Windows' && 'Dev release: Launcher Windows' || format('Launcher: {0}', matrix.system) }}"
    runs-on: ${{ matrix.system == 'Windows' && 'windows-latest' || 'ubuntu-26.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(needs.scope.outputs.launcher_systems) }}
    defaults:
      run:
        shell: bash
        working-directory: launcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/decomp-sources
      - uses: ./.github/actions/launcher-toolchain
        with:
          cache-key: checks-launcher-${{ matrix.system == 'Windows' && 'windows-latest' || 'ubuntu-26.04' }}
          components: clippy, rustfmt
      - name: Tauri's system libraries
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev

      # The pages' checks (yarn verify) are the same on every system: they run once, in
      # launcher-android. Here only what differs per system: the Rust side.
      - name: Rust format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Rust tests (the logic, and actions.json against the checkout)
        run: cargo test -p openrac-launcher-core

      - name: Rust lints (the whole app)
        run: |
          yarn install --immutable
          yarn build
          cargo clippy --workspace --all-targets -- -D warnings

  # One check for the launcher's systems (what branch protection requires): Windows is in the
  # matrix only for a dev release, so its own check cannot be the required one.
  launcher-gate:
    name: "Gate: Launcher"
    needs: [scope, launcher]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every system
        env:
          SCOPE: ${{ needs.scope.result }}
          RESULT: ${{ needs.launcher.result }}
        run: test "$SCOPE" = success && { test "$RESULT" = success || test "$RESULT" = skipped; }

  # The launcher's pages, once (they are the same on every system): svelte-check, ESLint,
  # Prettier and Vitest, then the Android layout in a browser (launcher/e2e/), page by page. No
  # Rust, one browser, one Vite server. On 24.04, which Playwright's install-deps knows.
  launcher-android:
    name: "Launcher: pages (lint, unit tests, Android layout)"
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.pages != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: launcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/decomp-sources
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
          package-manager-cache: false
      - run: npm install --global corepack@0.36.0 && corepack enable
      - uses: ./.github/actions/yarn-cache
      - name: The launcher's packages
        run: yarn install --immutable
      - name: Lint and unit tests (svelte-check, ESLint, Prettier, Vitest)
        run: yarn verify
      # The browser comes from Playwright's CDN, cached by version. No apt on the way: the
      # runner has its libraries already, and apt mirrors that fail to resolve took 10 minutes
      # and failed the job over fonts the tests never use. install-deps runs only when a
      # library is really missing, and is cut short.
      - id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      # Written by pushes only, as every cache here (.github/actions/compiler-cache/save).
      - if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: A headless Chromium
        run: |
          for try in 1 2 3; do
            timeout 180 yarn playwright-core install chromium-headless-shell && break
            [ "$try" = 3 ] && exit 1
            sleep $((try * 10))
          done
          shell=$(find ~/.cache/ms-playwright -type f -name 'chrome-headless-shell' -o -type f -name 'headless_shell' | head -n 1)
          if ldd "$shell" | grep -q 'not found'; then
            ldd "$shell" | grep 'not found'
            timeout 300 yarn playwright-core install-deps chromium-headless-shell \
              || echo "::warning::install-deps failed; trying the tests anyway"
          fi
      - name: Android pages
        run: yarn test:android

  # The native port (port/): hostgen's tests, then the port built with Clang and system SDL3, with
  # enhanced rendering compiled out, in parts, each on its own runner so that none outgrows the time
  # limit with a cold cache. "common" builds everything but the games' programs
  # (OPENRAC_PORT_GAMES_IN_ALL=OFF) and runs every test without a game-* label, exercising the
  # compatibility OpenGL/ES and core Vulkan paths on Mesa's software renderer. Each program's part
  # (port/game/*/hostgen.json "id": rac1-pal, rac2-ntsc...) builds openrac-<id> and runs its tests,
  # labelled game-<id> (port/cmake/Games.cmake). One part per program, not per game: Going
  # Commando's three programs in one job took 53 minutes with a cold cache. Every test runs in
  # exactly one part.
  port-part:
    name: "Port Linux: ${{ matrix.part == 'common' && 'shared code' || matrix.part }}"
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.port_parts != '[]' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.scope.outputs.port_parts) }}
    env:
      PART: ${{ matrix.part }}
      PORT_PROGRAMS: ${{ needs.scope.outputs.port_programs }}
      MESA_SHADER_CACHE_DIR: /tmp/openrac-mesa
      MESA_SHADER_CACHE_MAX_SIZE: 1G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/decomp-sources
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Each key's prefix is no other job's: "checks-port" was the start of every other port
      # job's key, and restored their objects, built with other options, when it had none. One key
      # per part, so that one program's objects never evict another's.
      - uses: ./.github/actions/compiler-cache
        with:
          key: checks-port-release-${{ matrix.part }}
          max-size: 1G
      - uses: ./.github/actions/mesa-cache
        if: matrix.part == 'common'
        with:
          variant: ubuntu-release
      - name: Compilers, SDL3 and software Vulkan
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            clang lld ninja-build libsdl3-dev
            libgl1-mesa-dev libegl1-mesa-dev libgl1-mesa-dri mesa-vulkan-drivers vulkan-validationlayers

      - uses: ./.github/actions/port-build-cache
        with:
          variant: ubuntu-compatibility-${{ matrix.part }}
          preset: release
          hostgen: ${{ matrix.part != 'common' }}

      - name: hostgen and build cache regressions
        if: matrix.part == 'common'
        run: |
          python -m unittest discover -s port/tools/hostgen -v
          # This job installs both Clang and ccache, so the real cache fixture runs here.
          python -m unittest discover -s tools -p test_ci_cache.py -v
          python -m unittest discover -s tools -p test_hostgen_cache.py -v

      - name: Build
        working-directory: port
        run: |
          cmake --preset release -DOPENRAC_ENHANCED_RENDERING=OFF -DOPENRAC_PROBE_BAKER=OFF \
            -DOPENRAC_BAKE_LZ4=OFF \
            -DOPENRAC_PORT_GAMES_IN_ALL=OFF
          if [ "$PART" = common ]; then
            cmake --build --preset release
          else
            cmake --build --preset release --target "openrac-$PART"
          fi

      # Run once: the configuration is the same in every part.
      - name: Verify compatibility build configuration
        if: matrix.part == 'common'
        working-directory: port
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          cache = pathlib.Path('build/release/CMakeCache.txt').read_text().splitlines()
          assert 'OPENRAC_ENHANCED_RENDERING:BOOL=OFF' in cache
          assert 'OPENRAC_PROBE_BAKER:BOOL=OFF' in cache
          tests = json.loads(subprocess.check_output(
              ['ctest', '--preset', 'release', '--show-only=json-v1']))['tests']
          names = {test['name'] for test in tests}
          enhanced = {'gtao_vulkan', 'probe_gpu_vulkan', 'early_lighting_vulkan',
                      'hero_shadow_vulkan', 'sun_shadow_vulkan', 'shadow_scroll_vulkan',
                      'fsr3_frame', 'probe_bake'}
          assert not names & enhanced, names & enhanced
          # Every game label is a part's: no test is left out of every part.
          programs = set(json.loads(os.environ['PORT_PROGRAMS']))
          for test in tests:
              labels = [label for prop in test.get('properties', []) if prop['name'] == 'LABELS'
                        for label in prop['value'] if label.startswith('game-')]
              assert len(labels) <= 1, (test['name'], labels)
              assert all(label[len('game-'):] in programs for label in labels), (test['name'], labels)
          PY

      - name: Tests
        working-directory: port
        env:
          SDL_VIDEO_DRIVER: offscreen
        run: |
          if [ "$PART" = common ]; then
            ctest --preset release --parallel 2 --stop-on-failure -LE '^game-'
          else
            ctest --preset release --parallel 2 --stop-on-failure --no-tests=error -L "^game-$PART\$"
          fi

      # What compiled before a failure still saves the next run the time.
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/compiler-cache/save
      - uses: ./.github/actions/port-build-cache/save

  # One check for every part (what branch protection requires).
  port:
    name: "Gate: Port Linux"
    needs: [scope, port-part]
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every part
        env:
          RESULT: ${{ needs.port-part.result }}
          PARTS: ${{ needs.scope.outputs.port_parts }}
        # Skipped only when the pull request needs no part.
        run: test "$RESULT" = success || { test "$RESULT" = skipped && test "$PARTS" = "[]"; }

  # Full enhanced Vulkan coverage and the offline Embree baker, separately from the compatibility
  # build above. The preset explicitly compiles enhanced code in. One job: the build, then two
  # CTest calls (tools/ci_port_tests.py): the tests without Vulkan, then all Vulkan tests. Full
  # tier only.
  port-vulkan-enhanced-build:
    name: "Enhanced Vulkan: build and tests"
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.enhanced != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      MESA_SHADER_CACHE_DIR: /tmp/openrac-mesa
      MESA_SHADER_CACHE_MAX_SIZE: 1G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/decomp-sources
      - uses: ./.github/actions/compiler-cache
        with:
          key: checks-port-enhanced
          max-size: 1G
      - uses: ./.github/actions/mesa-cache
        with:
          variant: ubuntu-enhanced-nopt
      - name: Restore enhanced Vulkan packages
        id: enhanced-apt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openrac-enhanced-apt/*.deb
          key: enhanced-apt-v2-ubuntu-26.04-${{ runner.arch }}-${{ hashFiles('.github/workflows/checks.yml') }}
          restore-keys: enhanced-apt-v2-ubuntu-26.04-${{ runner.arch }}-
      - name: Compilers, software Vulkan, Embree 4 and the test runtime
        uses: ./.github/actions/apt-install
        with:
          archives: ${{ runner.temp }}/openrac-enhanced-apt
          packages: >-
            clang lld ninja-build libembree-dev libsdl3-dev
            libgl1-mesa-dev libegl1-mesa-dev zstd
            libgl1 libegl1 libgles2 libglx-mesa0 libegl-mesa0 libgl1-mesa-dri
            mesa-vulkan-drivers vulkan-validationlayers xvfb xauth
      - name: Save enhanced Vulkan packages
        if: steps.enhanced-apt.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openrac-enhanced-apt/*.deb
          key: ${{ steps.enhanced-apt.outputs.cache-primary-key }}
      - uses: ./.github/actions/port-build-cache
        with:
          variant: ubuntu-enhanced-baker
          preset: enhanced
          hostgen: "false"
      # The shader compiler's own cache: one file per program, keyed by its source and glslang, so
      # only changed shaders compile again. The compiler deletes the entries it no longer uses.
      - name: Restore the shader compiler cache
        id: shader-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: port/build/enhanced/generated/shader_package/.cache
          key: shader-cache-v1-enhanced-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: shader-cache-v1-enhanced-${{ runner.os }}-${{ runner.arch }}-
      - name: List the restored shader compiler cache
        run: |
          { ls port/build/enhanced/generated/shader_package/.cache 2>/dev/null || true; } |
            sha256sum > "$RUNNER_TEMP/shader-cache.list"

      - name: Build enhanced lighting and baker
        working-directory: port
        run: |
          # Keep the preset's compiler flags so PRs can reuse develop's cached objects.
          cmake --preset enhanced -DOPENRAC_PORT_GAMES=OFF -DOPENRAC_PROBE_BAKER=ON \
            -DOPENRAC_LIGHT_AUTHORING=ON -DOPENRAC_RENDER_EQUIVALENCE_FOUR_SHARDS=ON \
            -DOPENRAC_VULKAN_TEST_SEED_CACHE=ON
          cmake --build --preset enhanced

      # Only a push writes it, and only when the compiler added or dropped an entry.
      - name: Check the shader compiler cache
        id: shader-cache-new
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        env:
          RESTORED: ${{ steps.shader-cache.outputs.cache-matched-key }}
        run: |
          changed=true
          { ls port/build/enhanced/generated/shader_package/.cache 2>/dev/null || true; } |
            sha256sum | cmp -s - "$RUNNER_TEMP/shader-cache.list" && changed=false
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          entries=$({ ls port/build/enhanced/generated/shader_package/.cache 2>/dev/null || true; } | wc -l)
          echo "::notice title=shader cache::$entries entries, restored ${RESTORED:-none}, save: $changed"
      - name: Save the shader compiler cache
        if: steps.shader-cache-new.outputs.changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: port/build/enhanced/generated/shader_package/.cache
          key: ${{ steps.shader-cache.outputs.cache-primary-key }}

      - name: The tests
        env:
          SDL_VIDEO_DRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIVM_PERF: nopt
        run: |
          python3 tools/ci_port_tests.py port/build/enhanced plan
          # Both groups, even after the first fails, so that one run shows every failure.
          failed=""
          for group in host vulkan; do
            echo "::group::$group"
            xvfb-run -a python3 tools/ci_port_tests.py port/build/enhanced "$group" || failed="$failed $group"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::failed test groups:$failed"; exit 1; fi

      - name: Save enhanced test timings and failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enhanced-test-results
          path: |
            port/build/enhanced/ci-*-results.xml
            port/build/enhanced/Testing/Temporary/LastTest.log
          retention-days: 7
          if-no-files-found: ignore

      # What compiled before a failure still saves the next run the time.
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/compiler-cache/save
      - uses: ./.github/actions/port-build-cache/save

  # One check for the build and its tests (what branch protection requires).
  port-vulkan-enhanced:
    name: "Gate: Enhanced Vulkan"
    needs: [scope, port-vulkan-enhanced-build]
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require the build and its tests
        env:
          RESULT: ${{ needs.port-vulkan-enhanced-build.result }}
          NEEDED: ${{ needs.scope.outputs.enhanced }}
        # Skipped only when the change does not touch what the enhanced build reads, or in a pull
        # request's fast tier (the merge queue runs it).
        run: |
          if [ "$NEEDED" = false ]; then test "$RESULT" = skipped; exit; fi
          test "$RESULT" = success

  # The native port on Windows: rac1/pal's program built as the launcher's
  # "Build the game" builds it (tools/build_port.py: Visual Studio's C++
  # libraries and the Windows SDK, Clang, Ninja), then the runtime's tests and
  # those of hostgen's that need no POSIX host. The port is written on Linux
  # and macOS, and what only builds there (execinfo.h, fseeko) stops here.
  port-windows:
    name: "Dev release: Port Windows"
    needs: scope
    # Only when everything is checked (a dev release, a manual run).
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.windows == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/decomp-sources
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: ./.github/actions/compiler-cache
        with:
          key: checks-port-windows
          max-size: 1G
      - uses: ./.github/actions/clang-windows

      - uses: ./.github/actions/port-build-cache
        with:
          variant: windows-release
          preset: release

      - name: Build openrac-rac1-pal and the runtime and diagnostic tests
        run: python tools/build_port.py rac1-pal --target runtime_test --target log_test --target crash_symbols_test --target breadcrumbs_test --target breadcrumbs_no_alloc_test --target render_worker_test

      - name: Windows build environment tests
        run: python -m unittest discover -s tools -p test_build_port.py -v

      - name: The runtime and Windows diagnostic tests
        run: ctest --test-dir port/build/release -R "^(runtime|log|crash_symbols|crash_symbols_local|breadcrumbs|breadcrumbs_no_alloc|render_worker)$" --output-on-failure

      - name: hostgen's tests
        run: python -m unittest discover -s port/tools/hostgen -v

      # What compiled before a failure still saves the next run the time.
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/compiler-cache/save
      - uses: ./.github/actions/port-build-cache/save
