name: checks
run-name: Full Vulkan suite timing
on:
  push:
    branches: [codex/lavapipe-spirv-ci]
permissions:
  contents: read
env:
  OPENRAC_BUILD_JOBS: all
  CCACHE_COMPILERCHECK: content
  OPENRAC_HOSTGEN_NO_DISC: "1"
jobs:
  enhanced_vulkan:
    name: enhanced_vulkan
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      MESA_SHADER_CACHE_DIR: /tmp/openrac-mesa
      MESA_SHADER_CACHE_MAX_SIZE: 1G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/decomp-sources
      - uses: ./.github/actions/compiler-cache
        with:
          key: checks-port-enhanced
          max-size: 1G
      - uses: ./.github/actions/mesa-cache
        with:
          variant: ubuntu-enhanced-nopt
      - name: Restore enhanced Vulkan packages
        id: enhanced-apt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openrac-enhanced-apt/*.deb
          key: enhanced-apt-v2-ubuntu-26.04-${{ runner.arch }}-${{ hashFiles('.github/workflows/checks.yml') }}
          restore-keys: enhanced-apt-v2-ubuntu-26.04-${{ runner.arch }}-
      - name: Compilers, software Vulkan, Embree 4 and the test runtime
        uses: ./.github/actions/apt-install
        with:
          archives: ${{ runner.temp }}/openrac-enhanced-apt
          packages: >-
            clang lld ninja-build libembree-dev libsdl3-dev
            libgl1-mesa-dev libegl1-mesa-dev zstd
            libgl1 libegl1 libgles2 libglx-mesa0 libegl-mesa0 libgl1-mesa-dri
            mesa-vulkan-drivers vulkan-validationlayers xvfb xauth
      - name: Save enhanced Vulkan packages
        if: steps.enhanced-apt.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openrac-enhanced-apt/*.deb
          key: ${{ steps.enhanced-apt.outputs.cache-primary-key }}
      - name: Hand on enhanced Vulkan packages
        if: steps.enhanced-apt.outputs.cache-hit != 'true' && github.event_name == 'merge_group'
        uses: ./.github/actions/cache-out
        with:
          path: ${{ runner.temp }}/openrac-enhanced-apt/*.deb
          key: ${{ steps.enhanced-apt.outputs.cache-primary-key }}
      - uses: ./.github/actions/port-build-cache
        with:
          variant: ubuntu-enhanced-baker
          preset: enhanced
          hostgen: "false"
      # The shader compiler's own cache: one file per program, keyed by its source and glslang, so
      # only changed shaders compile again. The compiler deletes the entries it no longer uses.
      - name: Restore the shader compiler cache
        id: shader-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: port/build/enhanced/generated/shader_package/.cache
          key: shader-cache-v1-enhanced-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: shader-cache-v1-enhanced-${{ runner.os }}-${{ runner.arch }}-
      - name: List the restored shader compiler cache
        run: |
          { ls port/build/enhanced/generated/shader_package/.cache 2>/dev/null || true; } |
            sha256sum > "$RUNNER_TEMP/shader-cache.list"

      - name: Build enhanced lighting and baker
        working-directory: port
        run: |
          # Keep the preset's compiler flags so PRs can reuse develop's cached objects.
          cmake --preset enhanced -DOPENRAC_PORT_GAMES=OFF -DOPENRAC_PROBE_BAKER=ON \
            -DOPENRAC_LIGHT_AUTHORING=ON -DOPENRAC_RENDER_EQUIVALENCE_FOUR_SHARDS=ON \
            -DOPENRAC_VULKAN_TEST_SEED_CACHE=ON
          cmake --build --preset enhanced

      # Only a push writes it (develop's queue hands it on), and only when the compiler added or
      # dropped an entry.
      - name: Check the shader compiler cache
        id: shader-cache-new
        if: github.event_name != 'pull_request'
        env:
          RESTORED: ${{ steps.shader-cache.outputs.cache-matched-key }}
        run: |
          changed=true
          { ls port/build/enhanced/generated/shader_package/.cache 2>/dev/null || true; } |
            sha256sum | cmp -s - "$RUNNER_TEMP/shader-cache.list" && changed=false
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          entries=$({ ls port/build/enhanced/generated/shader_package/.cache 2>/dev/null || true; } | wc -l)
          echo "::notice title=shader cache::$entries entries, restored ${RESTORED:-none}, save: $changed"
      - name: Save the shader compiler cache
        if: steps.shader-cache-new.outputs.changed == 'true' && github.event_name != 'merge_group'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: port/build/enhanced/generated/shader_package/.cache
          key: ${{ steps.shader-cache.outputs.cache-primary-key }}
      - name: Hand on the shader compiler cache
        if: steps.shader-cache-new.outputs.changed == 'true' && github.event_name == 'merge_group'
        uses: ./.github/actions/cache-out
        with:
          path: port/build/enhanced/generated/shader_package/.cache
          key: ${{ steps.shader-cache.outputs.cache-primary-key }}

      - name: The tests
        env:
          SDL_VIDEO_DRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIVM_PERF: nopt
        run: |
          python3 tools/ci_port_tests.py port/build/enhanced plan
          # Both groups, even after the first fails, so that one run shows every failure.
          failed=""
          for group in host vulkan; do
            echo "::group::$group"
            xvfb-run -a python3 tools/ci_port_tests.py port/build/enhanced "$group" || failed="$failed $group"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::failed test groups:$failed"; exit 1; fi

      - name: Save enhanced test timings and failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enhanced-test-results
          path: |
            port/build/enhanced/ci-*-results.xml
            port/build/enhanced/Testing/Temporary/LastTest.log
          retention-days: 7
          if-no-files-found: ignore

      # What compiled before a failure still saves the next run the time.
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/compiler-cache/save
      - uses: ./.github/actions/port-build-cache/save
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/mesa-cache/save
