[package]
name = "openrac-launcher-core"
description = "The OpenRAC launcher's logic: games, actions, settings, detection and jobs, without a window"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
chd = { version = "0.4.0", default-features = false, features = ["std"] }
# Mod codes (modset.rs): a set's JSON, zlib-compressed.
flate2 = "1.1.11"
minisign-verify = "0.3"
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
# Mods from a repository's release (remote.rs): the assets' SHA-256 against SHA256SUMS.
sha2 = "0.11.1"
# TypeScript types of what the page receives (tests/generated_types.rs); `no-serde-warnings`: serde's `alias` has no TypeScript meaning.
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
# Mods added as a .zip (plugins.rs): reading, deflate through flate2's Rust back end.
zip = { version = "9.4.1", default-features = false, features = [
    "deflate-flate2",
] }
tempfile = "3.27.0"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
